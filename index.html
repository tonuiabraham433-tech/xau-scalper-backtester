<title>XAUUSD Scalper Backtester V1</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0b0f14;
 color:#e8edf3;
 font-family:Arial,sans-serif;
}

.app{
 max-width:850px;
 margin:auto;
 padding:16px;
}

header{

}

h1{margin:0 0 6px}
.sub{color:#8995a3;font-size:14px}

.panel{

 margin-bottom:14px;
}

h2{
 font-size:18px;
 margin-top:0;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);

}

label{

}

input{

}

button{

 font-weight:bold;
 font-size:15px;
}

button.secondary{
 background:#273342;
}

.stats{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}

.stat{
 background:#0b0f14;
 border:1px solid #202b38;
 padding:13px;
 border-radius:10px;
}

.stat small{
 display:block;
 color:#8995a3;
}

.stat strong{
 display:block;
 margin-top:5px;
 font-size:20px;
}

#status{
 color:#9ba7b5;
 margin-top:10px;
 font-size:13px;
}

.trade{
 border:1px solid #273342;
 border-radius:9px;
 padding:10px;
 margin-top:8px;
 font-size:13px;
}

.win{border-left:4px solid #16a05d}
.loss{border-left:4px solid #e04b4b}
